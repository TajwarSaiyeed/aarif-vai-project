<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Myntra</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../global.css" />
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-pink-50 to-orange-50 font-sans"
  >
    <!-- Desktop Header Placeholder -->
    <div class="h-20"></div>

    <!-- Navigation Overlay -->
    <div
      class="nav fixed left-0 top-0 w-full h-full overflow-hidden pointer-events-none bg-gradient-to-br from-pink-50 to-orange-50"
    >
      <div
        class="app-nav bg-white text-gray-800 relative max-w-sm w-11/12 h-full shadow-lg transform -translate-x-full flex flex-col z-30 pointer-events-auto transition-transform duration-300 ease-out"
      >
        <div id="navContent"></div>
      </div>
    </div>

    <div class="relative">
      <!-- Main Content -->
      <div class="mt-7 mx-auto max-w-sm bg-white">
        <div class="min-h-[calc(100vh-50px)]">
          <div class="relative">
            <!-- Offer Banner -->
            <div class="h-40 w-full bg-blue-100">
              <picture class="block w-full h-full">
                <source
                  srcset="
                    //assets.myntassets.com/f_webp,dpr_1.5,q_60,w_400,c_limit,fl_progressive/assets/images/2023/1/25/f5e9a029-33c3-4a92-811b-ef7917fe6d441674670210687-offer-banner-300-600x240-code-_-MYNTRA300.jpg
                  "
                  type="image/webp"
                />
                <img
                  src="./Myntra_files/f5e9a029-33c3-4a92-811b-ef7917fe6d441674670210687-offer-banner-300-600x240-code-_-MYNTRA300.jpg"
                  class="block max-w-full h-auto w-full bg-white text-white opacity-100 transition-opacity duration-300"
                  alt=""
                  title=""
                />
              </picture>
            </div>

            <!-- Sign In Container -->
            <div class="px-9 pt-9 pb-0">
              <!-- Welcome Header -->
              <div class="font-bold text-xl mb-6 font-sans">
                Login
                <span class="text-base font-normal text-gray-600 ml-1">or</span>
                Signup
              </div>

              <!-- Mobile Input Container -->
              <div class="relative">
                <!-- Form Group -->
                <div class="mb-6 relative">
                  <input
                    autocomplete="new-password"
                    type="tel"
                    id="mobileInput"
                    class="mobile-input border border-gray-300 w-full text-sm px-3 py-3 pl-16 h-auto text-gray-800 focus:border-gray-800 focus:outline-none transition-all duration-400 caret-pink-500"
                    placeholder=""
                    maxlength="10"
                    value=""
                  />
                  <span
                    class="mobile-label absolute top-2.5 left-3 text-sm text-gray-500 pointer-events-none transition-all duration-200"
                  >
                    +91
                    <span class="px-2.5 relative -bottom-px">|</span>
                    <span class="mobile-placeholder">
                      Mobile Number<span class="text-orange-600">*</span>
                    </span>
                  </span>
                  <i class="bar hidden"></i>
                </div>

                <!-- Consent Container -->
                <div class="flex mb-5">
                  <input
                    type="checkbox"
                    class="consent-checkbox mr-2 mt-1 w-4 h-4 accent-pink-500"
                  />
                  <div
                    class="ml-2 text-sm flex-1 font-semibold text-gray-700 opacity-80"
                  >
                    By continuing, I agree to the
                    <a
                      href="https://www.myntra.com/termsofuse"
                      class="cursor-pointer text-pink-600 font-bold hover:text-pink-700"
                      >Terms of Use</a
                    >
                    &
                    <a
                      href="https://www.myntra.com/privacypolicy"
                      class="cursor-pointer text-pink-600 font-bold hover:text-pink-700"
                      >Privacy Policy</a
                    >
                    and I am above 18 years old.
                  </div>
                </div>

                <!-- Continue Button -->
                <div
                  class="continue-btn cursor-pointer text-center py-3 px-3 text-white font-bold text-sm leading-4 bg-gray-400 hover:bg-pink-500 transition-colors duration-300 disabled:cursor-not-allowed"
                >
                  CONTINUE
                </div>
              </div>

              <!-- Get Help -->
              <div class="mt-7 mb-7 text-sm">
                Have trouble logging in?
                <span
                  class="cursor-pointer text-pink-500 font-bold hover:text-pink-600"
                  >Get help</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const mobileInput = document.querySelector(".mobile-input");
        const mobileLabel = document.querySelector(".mobile-label");
        const mobilePlaceholder = document.querySelector(".mobile-placeholder");
        const continueBtn = document.querySelector(".continue-btn");
        const consentCheckbox = document.querySelector(".consent-checkbox");

        // Handle floating label effect
        function updateLabelState() {
          const hasValue = mobileInput.value.length > 0;
          const isFocused = document.activeElement === mobileInput;

          if (hasValue || isFocused) {
            // Hide the "Mobile Number*" part when typing or focused
            mobilePlaceholder.style.opacity = "0";
            mobilePlaceholder.style.visibility = "hidden";
            mobileLabel.style.color = isFocused ? "#ff3e6c" : "#94a3b8";
          } else {
            // Show the "Mobile Number*" part when empty and not focused
            mobilePlaceholder.style.opacity = "1";
            mobilePlaceholder.style.visibility = "visible";
            mobileLabel.style.color = "#94a3b8";
          }
        }

        // Handle input focus and blur
        mobileInput.addEventListener("focus", function () {
          updateLabelState();
        });

        mobileInput.addEventListener("blur", function () {
          updateLabelState();
        });

        mobileInput.addEventListener("input", function () {
          updateLabelState();
        });

        // Handle input validation and button state
        function updateButtonState() {
          const isValidPhone =
            mobileInput.value.length === 10 &&
            /^\d{10}$/.test(mobileInput.value);
          const isConsentChecked = consentCheckbox.checked;

          if (isValidPhone && isConsentChecked) {
            continueBtn.classList.remove("bg-gray-400");
            continueBtn.classList.add("bg-pink-500", "hover:bg-pink-600");
            continueBtn.style.cursor = "pointer";
          } else {
            continueBtn.classList.add("bg-gray-400");
            continueBtn.classList.remove("bg-pink-500", "hover:bg-pink-600");
            continueBtn.style.cursor = "not-allowed";
          }
        }

        mobileInput.addEventListener("input", function (e) {
          // Only allow numeric input
          this.value = this.value.replace(/\D/g, "");
          updateButtonState();
        });

        consentCheckbox.addEventListener("change", updateButtonState);

        // Initialize the label state
        updateLabelState();
      });
    </script>
  </body>
</html>
