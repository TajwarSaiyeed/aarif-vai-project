<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <link rel="stylesheet" href="style.css" />
    <title>Products</title>
  </head>
  <body>
    <div class="relative">
      <!-- desktop -->
      <div class="hidden md:block">
        <div class="container mx-auto px-4 py-8">
          <div class="flex justify-between items-center mb-4">
            <div>
              <ul class="flex items-center text-sm text-gray-500">
                <li><a href="#" class="hover:text-gray-800">Home</a></li>
                <li class="mx-2">/</li>
                <li><a href="#" class="hover:text-gray-800">Clothing</a></li>
                <li class="mx-2">/</li>
                <li class="font-semibold text-gray-800">Men's Fashion Store</li>
              </ul>
              <div class="mt-2 flex items-baseline gap-2">
                <h1 class="text-xl font-bold inline-block">
                  Men's Fashion Store
                </h1>
                <span
                  id="product-count-desktop"
                  class="text-gray-600 font-semibold text-sm"
                ></span>
              </div>
            </div>
          </div>

          <div class="flex">
            <!-- Filters -->
            <div class="w-1/4 border-r border-gray-200">
              <h2 class="text-lg font-bold mb-4 border-b border-gray-200 py-2">
                FILTERS
              </h2>

              <!-- Brand Filter -->
              <div class="mb-6 border-b border-gray-200 pb-4">
                <h3 class="font-bold mb-2 uppercase">Brand</h3>
                <ul class="space-y-1">
                  <li>
                    <label class="flex items-center"
                      ><input type="checkbox" class="mr-2" /> HIGHLANDER
                      <span class="text-gray-400 ml-1 text-xs"
                        >(7046)</span
                      ></label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><input type="checkbox" class="mr-2" /> Van Heusen
                      <span class="text-gray-400 ml-1 text-xs"
                        >(5363)</span
                      ></label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><input type="checkbox" class="mr-2" /> Roadster
                      <span class="text-gray-400 ml-1 text-xs"
                        >(4824)</span
                      ></label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><input type="checkbox" class="mr-2" /> Louis Philippe
                      <span class="text-gray-400 ml-1 text-xs"
                        >(4359)</span
                      ></label
                    >
                  </li>
                </ul>
                <button class="text-pink-500 font-bold mt-2">
                  + 1037 more
                </button>
              </div>

              <!-- Price Filter -->
              <div class="mb-6 border-b border-gray-200 pb-4">
                <h3 class="font-bold mb-2 uppercase">Price</h3>
                <ul class="space-y-1">
                  <li>
                    <label class="flex items-center"
                      ><input type="checkbox" class="mr-2" /> Rs. 199 to Rs.
                      549</label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><input type="checkbox" class="mr-2" /> Rs. 549 to Rs.
                      899</label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><input type="checkbox" class="mr-2" /> Rs. 899 to Rs.
                      1199</label
                    >
                  </li>
                </ul>
              </div>

              <!-- Color Filter -->
              <div class="mb-6 border-b border-gray-200 pb-4">
                <h3 class="font-bold mb-2 uppercase">Color</h3>
                <ul class="space-y-1">
                  <li>
                    <label class="flex items-center"
                      ><span
                        class="w-4 h-4 bg-blue-500 rounded-full mr-2 border"
                      ></span
                      >Blue
                      <span class="text-gray-400 ml-1 text-xs">(3)</span></label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><span
                        class="w-4 h-4 bg-black rounded-full mr-2 border"
                      ></span
                      >Black
                      <span class="text-gray-400 ml-1 text-xs">(2)</span></label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><span
                        class="w-4 h-4 bg-white rounded-full mr-2 border"
                      ></span
                      >White
                      <span class="text-gray-400 ml-1 text-xs">(1)</span></label
                    >
                  </li>
                </ul>
              </div>

              <!-- Discount Range -->
              <div>
                <h3 class="font-bold mb-2 uppercase">Discount Range</h3>
                <ul class="space-y-1">
                  <li>
                    <label class="flex items-center"
                      ><input type="radio" name="discount" class="mr-2" /> 10%
                      and above</label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><input type="radio" name="discount" class="mr-2" /> 20%
                      and above</label
                    >
                  </li>
                  <li>
                    <label class="flex items-center"
                      ><input type="radio" name="discount" class="mr-2" /> 30%
                      and above</label
                    >
                  </li>
                </ul>
              </div>
            </div>

            <!-- Products Grid -->
            <div class="w-3/4">
              <div class="mb-4 border-b border-gray-200">
                <!-- Filter Categories and Sort By on same line -->
                <div class="flex justify-between items-center px-4">
                  <!-- Filter Categories -->
                  <div id="filter-categories" class="flex items-center">
                    <!-- Dynamic filter categories will be inserted here -->
                  </div>

                  <!-- Sort By Dropdown -->
                  <div class="relative group">
                    <div
                      id="sort-by-container"
                      class="flex items-center justify-between px-4 py-2 text-sm text-gray-800 bg-white border border-gray-300 rounded-sm cursor-pointer w-64"
                    >
                      <div>
                        Sort by:
                        <span id="sort-by-value" class="font-bold capitalize"
                          >Recommended</span
                        >
                      </div>
                      <span
                        class="myntraweb-sprite sort-downArrow sprites-downArrow"
                      ></span>
                    </div>
                    <ul
                      id="sort-by-list"
                      class="absolute z-10 hidden group-hover:block w-64 py-4 m-0 bg-white border border-gray-300 border-t-0 shadow-lg"
                      style="top: 33px"
                    >
                      <li>
                        <label
                          class="block px-4 py-2 cursor-pointer hover:bg-gray-100"
                        >
                          <input
                            type="radio"
                            name="sort"
                            value="recommended"
                            class="hidden"
                            checked
                          />Recommended
                        </label>
                      </li>
                      <li>
                        <label
                          class="block px-4 py-2 cursor-pointer hover:bg-gray-100"
                        >
                          <input
                            type="radio"
                            name="sort"
                            value="new"
                            class="hidden"
                          />What's New
                        </label>
                      </li>
                      <li>
                        <label
                          class="block px-4 py-2 cursor-pointer hover:bg-gray-100"
                        >
                          <input
                            type="radio"
                            name="sort"
                            value="popularity"
                            class="hidden"
                          />Popularity
                        </label>
                      </li>
                      <li>
                        <label
                          class="block px-4 py-2 cursor-pointer hover:bg-gray-100"
                        >
                          <input
                            type="radio"
                            name="sort"
                            value="discount"
                            class="hidden"
                          />Better Discount
                        </label>
                      </li>
                      <li>
                        <label
                          class="block px-4 py-2 cursor-pointer hover:bg-gray-100"
                        >
                          <input
                            type="radio"
                            name="sort"
                            value="price_desc"
                            class="hidden"
                          />Price: High to Low
                        </label>
                      </li>
                      <li>
                        <label
                          class="block px-4 py-2 cursor-pointer hover:bg-gray-100"
                        >
                          <input
                            type="radio"
                            name="sort"
                            value="price_asc"
                            class="hidden"
                          />Price: Low to High
                        </label>
                      </li>
                      <li>
                        <label
                          class="block px-4 py-2 cursor-pointer hover:bg-gray-100"
                        >
                          <input
                            type="radio"
                            name="sort"
                            value="customer_rating"
                            class="hidden"
                          />Customer Rating
                        </label>
                      </li>
                    </ul>
                  </div>
                </div>

                <!-- Sub-categories Container (Full Width) -->
                <div
                  id="sub-categories-container"
                  class="hidden px-4 py-2 bg-gray-50 w-full"
                >
                  <div class="flex flex-wrap gap-2" id="sub-categories-list">
                    <!-- Sub-categories will be inserted here -->
                  </div>
                </div>
              </div>
              <div
                id="products-grid-desktop"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 px-4"
              >
                <!-- Product cards will be injected here -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- mobile -->
      <div
        id="products-slider-mobile"
        class="grid grid-cols-2 gap-0 md:hidden mb-10"
      ></div>

      <div
        class="fixed bottom-0 bg-white w-full z-10 text-center border-t border-gray-200 flex justify-evenly items-center md:hidden"
      >
        <button
          class="btn default btn primary flex items-center gap-2 font-semibold mr-2"
          id="sort-btn"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" class="w-4 h-4">
            <g fill="none" fill-rule="evenodd">
              <path d="M0 0h24v24H0z" opacity="0.05"></path>
              <path
                fill="#282C3F"
                d="M7.445 7.48V5.672L5.665 7.48h1.78zm1.09-4.42c.304.12.465.39.465.706v16.437a.784.784 0 01-.783.797.762.762 0 01-.772-.781V8.982H4.003a.832.832 0 01-.765-.204.759.759 0 01.002-1.105L7.652 3.23a.832.832 0 01.882-.17zm8.02 15.269l1.78-1.81h-1.78v1.81zm4.207-3.107a.76.76 0 01-.002 1.106l-4.412 4.442a.832.832 0 01-.882.17c-.305-.12-.466-.39-.466-.706V3.797c0-.432.332-.797.783-.797.45 0 .772.35.772.781v11.237h3.442a.833.833 0 01.765.204z"
              ></path>
            </g>
          </svg>
          SORT
        </button>
        <div class="w-[1px] h-12 bg-gray-200"></div>

        <button
          class="btn default btn primary flex items-center gap-2 font-semibold"
          id="filter-btn"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" class="w-4 h-4">
            <g fill="none" fill-rule="evenodd">
              <path d="M0 0h24v24H0z" opacity="0.05"></path>
              <path
                fill="#282C3F"
                d="M3.749 7.508a.75.75 0 010-1.5h3.138a2.247 2.247 0 014.243 0h9.121a.75.75 0 010 1.5h-9.126a2.248 2.248 0 01-4.232 0H3.749zm13.373 9h3.129a.75.75 0 010 1.5h-3.135a2.247 2.247 0 01-4.231 0H3.749a.75.75 0 010-1.5h9.13a2.248 2.248 0 014.243 0z"
              ></path>
            </g>
          </svg>
          FILTER
        </button>
      </div>

      <!-- Sort Modal -->

      <div
        class="fixed inset-0 bg-black opacity-0 pointer-events-none transition-opacity duration-300"
        id="sort-overlay-bg"
      ></div>

      <div
        class="bg-white fixed w-full min-h-80 bottom-0 left-0 translate-y-full transition-transform duration-300"
        id="sort-overlay"
      >
        <ul class="p-4 flex flex-col gap-2">
          <li class="uppercase font-bold">Sort By</li>
          <div class="w-full h-[1px] bg-gray-200"></div>
          <li>
            <button class="flex items-center gap-2" data-sort="popularity">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <defs><path id="a" d="M0 0h12.5v16H0z"></path></defs>
                <g fill="none" fill-rule="evenodd">
                  <path d="M0 0h24v24H0z" opacity="0.05"></path>
                  <g transform="translate(6 4)">
                    <mask id="b" fill="#fff">
                      <use xlink:href="#a"></use>
                    </mask>
                    <path
                      fill="#282C3F"
                      d="M11.425 10.52c-.096.743-.417 1.506-.93 2.208-.426.58-.978 1.11-1.517 1.452a6.01 6.01 0 01-.162.099c.047-.114.088-.233.124-.356.227-.775.199-1.534-.088-2.39-.255-.764-.714-1.607-1.49-2.734l-.55-.8-.361.906c-.004.01-.437 1.018-1.922 1.9-.93.552-1.22 1.28-1.302 1.795-.091.582.035 1.149.245 1.617a5.157 5.157 0 01-.162.099c-.304-.12-.465-.39-.465-.706V3.797c0-.432.332-.797.783-.797.45 0 .772.35.772.781v11.237h3.442a.833.833 0 01.765.204z"
                    ></path>
                  </g>
                </g>
              </svg>
              Popularity
            </button>
          </li>
          <li>
            <button class="flex items-center gap-2" data-sort="latest">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <defs><path id="a" d="M0 0h12.5v16H0z"></path></defs>
                <g fill="none" fill-rule="evenodd">
                  <path d="M0 0h24v24H0z" opacity="0.05"></path>
                  <g transform="translate(6 4)">
                    <mask id="b" fill="#fff">
                      <use xlink:href="#a"></use>
                    </mask>
                    <path
                      fill="#282C3F"
                      d="M11.425 10.52c-.096.743-.417 1.506-.93 2.208-.426.58-.978 1.11-1.517 1.452a6.01 6.01 0 01-.162.099c.047-.114.088-.233.124-.356.227-.775.199-1.534-.088-2.39-.255-.764-.714-1.607-1.49-2.734l-.55-.8-.361.906c-.004.01-.437 1.018-1.922 1.9-.93.552-1.22 1.28-1.302 1.795-.091.582.035 1.149.245 1.617a5.157 5.157 0 01-.162.099c-.304-.12-.465-.39-.465-.706V3.797c0-.432.332-.797.783-.797.45 0 .772.35.772.781v11.237h3.442a.833.833 0 01.765.204z"
                    ></path>
                  </g>
                </g>
              </svg>
              What's New
            </button>
          </li>
          <li>
            <button class="flex items-center gap-2" data-sort="discount">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <defs><path id="a" d="M0 0h12.5v16H0z"></path></defs>
                <g fill="none" fill-rule="evenodd">
                  <path d="M0 0h24v24H0z" opacity="0.05"></path>
                  <g transform="translate(6 4)">
                    <mask id="b" fill="#fff">
                      <use xlink:href="#a"></use>
                    </mask>
                    <path
                      fill="#282C3F"
                      d="M11.425 10.52c-.096.743-.417 1.506-.93 2.208-.426.58-.978 1.11-1.517 1.452a6.01 6.01 0 01-.162.099c.047-.114.088-.233.124-.356.227-.775.199-1.534-.088-2.39-.255-.764-.714-1.607-1.49-2.734l-.55-.8-.361.906c-.004.01-.437 1.018-1.922 1.9-.93.552-1.22 1.28-1.302 1.795-.091.582.035 1.149.245 1.617a5.157 5.157 0 01-.162.099c-.304-.12-.465-.39-.465-.706V3.797c0-.432.332-.797.783-.797.45 0 .772.35.772.781v11.237h3.442a.833.833 0 01.765.204z"
                    ></path>
                  </g>
                </g>
              </svg>
              Better Discount
            </button>
          </li>
          <li>
            <button class="flex items-center gap-2" data-sort="price-high-low">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <defs><path id="a" d="M0 0h12.5v16H0z"></path></defs>
                <g fill="none" fill-rule="evenodd">
                  <path d="M0 0h24v24H0z" opacity="0.05"></path>
                  <g transform="translate(6 4)">
                    <mask id="b" fill="#fff">
                      <use xlink:href="#a"></use>
                    </mask>
                    <path
                      fill="#282C3F"
                      d="M11.425 10.52c-.096.743-.417 1.506-.93 2.208-.426.58-.978 1.11-1.517 1.452a6.01 6.01 0 01-.162.099c.047-.114.088-.233.124-.356.227-.775.199-1.534-.088-2.39-.255-.764-.714-1.607-1.49-2.734l-.55-.8-.361.906c-.004.01-.437 1.018-1.922 1.9-.93.552-1.22 1.28-1.302 1.795-.091.582.035 1.149.245 1.617a5.157 5.157 0 01-.162.099c-.304-.12-.465-.39-.465-.706V3.797c0-.432.332-.797.783-.797.45 0 .772.35.772.781v11.237h3.442a.833.833 0 01.765.204z"
                    ></path>
                  </g>
                </g>
              </svg>
              Price: High to Low
            </button>
          </li>
          <li>
            <button class="flex items-center gap-2" data-sort="price-low-high">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <defs><path id="a" d="M0 0h12.5v16H0z"></path></defs>
                <g fill="none" fill-rule="evenodd">
                  <path d="M0 0h24v24H0z" opacity="0.05"></path>
                  <g transform="translate(6 4)">
                    <mask id="b" fill="#fff">
                      <use xlink:href="#a"></use>
                    </mask>
                    <path
                      fill="#282C3F"
                      d="M11.425 10.52c-.096.743-.417 1.506-.93 2.208-.426.58-.978 1.11-1.517 1.452a6.01 6.01 0 01-.162.099c.047-.114.088-.233.124-.356.227-.775.199-1.534-.088-2.39-.255-.764-.714-1.607-1.49-2.734l-.55-.8-.361.906c-.004.01-.437 1.018-1.922 1.9-.93.552-1.22 1.28-1.302 1.795-.091.582.035 1.149.245 1.617a5.157 5.157 0 01-.162.099c-.304-.12-.465-.39-.465-.706V3.797c0-.432.332-.797.783-.797.45 0 .772.35.772.781v11.237h3.442a.833.833 0 01.765.204z"
                    ></path>
                  </g>
                </g>
              </svg>
              Price: Low to High
            </button>
          </li>
          <li>
            <button class="flex items-center gap-2" data-sort="rating">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <defs><path id="a" d="M0 0h12.5v16H0z"></path></defs>
                <g fill="none" fill-rule="evenodd">
                  <path d="M0 0h24v24H0z" opacity="0.05"></path>
                  <g transform="translate(6 4)">
                    <mask id="b" fill="#fff">
                      <use xlink:href="#a"></use>
                    </mask>
                    <path
                      fill="#282C3F"
                      d="M11.425 10.52c-.096.743-.417 1.506-.93 2.208-.426.58-.978 1.11-1.517 1.452a6.01 6.01 0 01-.162.099c.047-.114.088-.233.124-.356.227-.775.199-1.534-.088-2.39-.255-.764-.714-1.607-1.49-2.734l-.55-.8-.361.906c-.004.01-.437 1.018-1.922 1.9-.93.552-1.22 1.28-1.302 1.795-.091.582.035 1.149.245 1.617a5.157 5.157 0 01-.162.099c-.304-.12-.465-.39-.465-.706V3.797c0-.432.332-.797.783-.797.45 0 .772.35.772.781v11.237h3.442a.833.833 0 01.765.204z"
                    ></path>
                  </g>
                </g>
              </svg>
              Customer Rating
            </button>
          </li>
        </ul>
      </div>

      <!-- Filter Modal -->

      <div
        class="fixed inset-0 bg-black opacity-0 pointer-events-none transition-opacity duration-300"
        id="filter-overlay-bg"
      ></div>

      <div
        class="bg-white fixed w-full min-h-80 bottom-0 left-0 translate-y-full transition-transform duration-300"
        id="filter-overlay"
      >
        <div class="p-4">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">Filters</h2>
            <button
              class="text-gray-500"
              id="close-filter-btn"
              aria-label="Close filter panel"
            >
              <svg width="24" height="24" viewBox="0 0 24 24">
                <path
                  fill="currentColor"
                  d="M6.293 7.293a1 1 0 011.414 0L12 11.586l4.293-4.293a1 1 0 111.414 1.414l-4.293 4.293 4.293 4.293a1 1 0 01-1.414 1.414L12 13.414l-4.293 4.293a1 1 0 01-1.414-1.414l4.293-4.293-4.293-4.293a1 1 0 010-1.414z"
                ></path>
              </svg>
            </button>
          </div>

          <div class="flex flex-col gap-4">
            <!-- Brand Filter -->
            <div>
              <h3 class="font-bold mb-2 uppercase">Brand</h3>
              <div class="flex flex-col gap-2">
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2" /> HIGHLANDER
                  <span class="text-gray-400 ml-1 text-xs">(7046)</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2" /> Van Heusen
                  <span class="text-gray-400 ml-1 text-xs">(5363)</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2" /> Roadster
                  <span class="text-gray-400 ml-1 text-xs">(4824)</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2" /> Louis Philippe
                  <span class="text-gray-400 ml-1 text-xs">(4359)</span>
                </label>
              </div>
              <button class="text-pink-500 font-bold mt-2">+ 1037 more</button>
            </div>

            <!-- Price Filter -->
            <div>
              <h3 class="font-bold mb-2 uppercase">Price</h3>
              <div class="flex flex-col gap-2">
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2" /> Rs. 199 to Rs. 549
                </label>
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2" /> Rs. 549 to Rs. 899
                </label>
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2" /> Rs. 899 to Rs. 1199
                </label>
              </div>
            </div>

            <!-- Color Filter -->
            <div>
              <h3 class="font-bold mb-2 uppercase">Color</h3>
              <div class="flex flex-col gap-2">
                <label class="flex items-center">
                  <span
                    class="w-4 h-4 bg-blue-500 rounded-full mr-2 border"
                  ></span>
                  Blue
                  <span class="text-gray-400 ml-1 text-xs">(3)</span>
                </label>
                <label class="flex items-center">
                  <span
                    class="w-4 h-4 bg-black rounded-full mr-2 border"
                  ></span>
                  Black
                  <span class="text-gray-400 ml-1 text-xs">(2)</span>
                </label>
                <label class="flex items-center">
                  <span
                    class="w-4 h-4 bg-white rounded-full mr-2 border"
                  ></span>
                  White
                  <span class="text-gray-400 ml-1 text-xs">(1)</span>
                </label>
              </div>
            </div>

            <!-- Discount Range -->
            <div>
              <h3 class="font-bold mb-2 uppercase">Discount Range</h3>
              <div class="flex flex-col gap-2">
                <label class="flex items-center">
                  <input type="radio" name="discount" class="mr-2" /> 10% and
                  above
                </label>
                <label class="flex items-center">
                  <input type="radio" name="discount" class="mr-2" /> 20% and
                  above
                </label>
                <label class="flex items-center">
                  <input type="radio" name="discount" class="mr-2" /> 30% and
                  above

            </div>
          </div>

          <!-- Bottom Action Bar -->
          <div
            class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4"

            <div class="flex gap-3">
              <button
                class="flex-1 border border-gray-200 text-gray-700 py-3 px-4 rounded-lg font-medium hover:bg-gray-50 transition-colors"
                id="clear-filters-btn"
              >
                Clear All
              </button>
              <button
                class="flex-1 bg-pink-500 text-white py-3 px-4 rounded-lg font-medium hover:bg-pink-600 transition-colors"

          </div>
        </div>
      </div>
