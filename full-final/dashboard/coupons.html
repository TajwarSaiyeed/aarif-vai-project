<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coupons - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gradient-to-br from-pink-50 to-orange-50 font-sans">
    <header class="bg-white fixed top-0 left-0 right-0 shadow-sm z-50">
      <div
        class="max-w-[1200px] mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center">Myntra</div>
        <div class="flex items-center">
          <a class="mr-6" href="/">Home</a>
          <a href="#">Profile</a>
        </div>
      </div>
    </header>

    <main class="relative mt-20 px-6">
      <div class="max-w-[1200px] mx-auto py-10">
        <div class="grid grid-cols-12 gap-8">
          <aside class="col-span-12 lg:col-span-3">
            <h3 class="text-sm font-bold mb-4">MY PROFILE</h3>
            <nav class="space-y-3">
              <a
                href="index.html"
                class="block bg-gray-100 text-center py-3 rounded shadow-sm"
                >OVERVIEW</a
              >
              <a
                href="orders.html"
                class="block bg-gray-100 text-center py-3 rounded shadow-sm"
                >ORDERS</a
              >
              <a
                href="coupons.html"
                class="block bg-pink-50 text-center py-3 rounded shadow-sm font-semibold"
                >COUPONS</a
              >
              <a
                href="address.html"
                class="block bg-gray-100 text-center py-3 rounded shadow-sm"
                >ADDRESS</a
              >
            </nav>
          </aside>

          <section
            class="col-span-12 lg:col-span-9 bg-white p-6 border border-gray-100"
          >
            <h2 class="text-xl font-bold mb-4">Coupons</h2>
            <p class="text-sm text-gray-500">
              Active coupons for your account.
            </p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
              <div class="border rounded p-4">
                <div class="font-bold">SAVE20</div>
                <div class="text-sm text-gray-500">
                  20% off on orders above $50
                </div>
              </div>
              <div class="border rounded p-4">
                <div class="font-bold">FREESHIP</div>
                <div class="text-sm text-gray-500">
                  Free shipping on your next order
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="../nav.js"></script>
    <script src="../type-writer.js"></script>
  </body>
</html>
