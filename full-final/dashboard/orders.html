<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gradient-to-br from-pink-50 to-orange-50 font-sans">
    <!-- Reuse header/nav from index.html -->
    <!-- ...existing header... -->
    <!-- For brevity we'll include a minimal header similar to index.html -->
    <header class="bg-white fixed top-0 left-0 right-0 shadow-sm z-50">
      <div
        class="max-w-[1200px] mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center">Myntra</div>
        <div class="flex items-center">
          <a class="mr-6" href="/">Home</a>
          <a href="#">Profile</a>
        </div>
      </div>
    </header>

    <main class="relative mt-20 px-6">
      <div class="max-w-[1200px] mx-auto py-10">
        <div class="grid grid-cols-12 gap-8">
          <aside class="col-span-12 lg:col-span-3">
            <h3 class="text-sm font-bold mb-4">MY PROFILE</h3>
            <nav class="space-y-3">
              <a
                href="index.html"
                class="block bg-gray-100 text-center py-3 rounded shadow-sm"
                >OVERVIEW</a
              >
              <a
                href="orders.html"
                class="block bg-pink-50 text-center py-3 rounded shadow-sm font-semibold"
                >ORDERS</a
              >
              <a
                href="coupons.html"
                class="block bg-gray-100 text-center py-3 rounded shadow-sm"
                >COUPONS</a
              >
              <a
                href="address.html"
                class="block bg-gray-100 text-center py-3 rounded shadow-sm"
                >ADDRESS</a
              >
            </nav>
          </aside>

          <section
            class="col-span-12 lg:col-span-9 bg-white p-6 border border-gray-100"
          >
            <div class="flex items-center justify-between mb-6">
              <div>
                <h2 class="text-xl font-bold">Orders</h2>
                <p class="text-sm text-gray-500">
                  Your recent orders and status
                </p>
              </div>
              <div class="space-x-2">
                <button class="px-4 py-2 bg-green-100 rounded">
                  All Orders
                </button>
                <button class="px-4 py-2 bg-yellow-100 rounded">
                  On Progress
                </button>
                <button class="px-4 py-2 bg-gray-100 rounded">Completed</button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              <!-- Order card -->
              <div class="border rounded p-4 shadow-sm">
                <div class="flex items-start gap-4">
                  <div
                    class="w-10 h-10 bg-green-100 rounded flex items-center justify-center font-bold"
                  >
                    A4
                  </div>
                  <div class="flex-1">
                    <div class="flex items-center justify-between">
                      <div class="font-semibold">Ariel Hikmat</div>
                      <div class="text-xs text-gray-500">Ready</div>
                    </div>
                    <div class="text-xs text-gray-400">
                      Wed, July 12, 2023 • 06:12 PM
                    </div>
                  </div>
                </div>

                <div class="mt-4 text-sm text-gray-600">
                  <div class="flex justify-between">
                    <div>Scrambled eggs with toast</div>
                    <div>$16.99</div>
                  </div>
                  <div class="flex justify-between">
                    <div>Smoked Salmon Bagel</div>
                    <div>$18.49</div>
                  </div>
                  <div class="flex justify-between mt-4 font-bold">
                    <div>Total</div>
                    <div>$87.34</div>
                  </div>
                </div>

                <div class="mt-4 flex gap-2">
                  <a href="#" class="px-3 py-2 border rounded text-sm"
                    >See Details</a
                  >
                  <button class="px-3 py-2 bg-yellow-400 rounded text-sm">
                    Pay Bills
                  </button>
                </div>
              </div>

              <!-- Repeat placeholder cards -->
              <div class="border rounded p-4 shadow-sm">(sample)</div>
              <div class="border rounded p-4 shadow-sm">(sample)</div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="../nav.js"></script>
    <script src="../type-writer.js"></script>
  </body>
</html>
