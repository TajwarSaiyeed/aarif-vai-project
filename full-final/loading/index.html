<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Spinner</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-white h-screen flex justify-center items-center m-0">
    <div
      class="bg-white rounded-full shadow-xl flex justify-center items-center w-8 h-8"
    >
      <span
        class="w-7 h-7 border-3 border-[#ff3f6c] border-b-transparent rounded-full inline-block box-border animate-[rotation_1s_linear_infinite]"
      ></span>
    </div>
  </body>
</html>
