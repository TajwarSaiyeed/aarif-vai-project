    <style>
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* style.css */
      #mobile-sidebar-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.25);
        z-index: 40;
        opacity: 0;
        transition: opacity 300ms ease-in-out;
        display: none;
        pointer-events: auto;
      }

      #mobile-sidebar-overlay.open {
        opacity: 1;
        display: block;
      }

      #mobile-sidebar {
        position: fixed;
        inset: 0;
        z-index: 70;
        transform: translateX(-100%);
        transition: transform 300ms ease-in-out;
        width: calc(100% - 80px);
      }

      #mobile-sidebar.open {
        transform: translateX(0);
      }

      #mobile-sidebar .content {
        background-color: white;
        height: 100%;
        width: 80%;
        padding: 16px;
      }

      @media (min-width: 1280px) {
        /* xl breakpoint */
        #mobile-sidebar,
        #mobile-sidebar-overlay {
          display: none;
        }
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Mobile search elements
        const mobileSearchButton = document.getElementById(
          "mobile-search-button"
        );
        const mobileSearchBar = document.getElementById("mobile-search-bar");

        // Mobile search bar toggle functionality
        if (mobileSearchButton && mobileSearchBar) {
          mobileSearchButton.addEventListener("click", (e) => {
            e.preventDefault();
            mobileSearchBar.classList.toggle("hidden");
          });
        }
      });
    </script>

    <!-- ripple-init: attach sidebar ripples on mobile -->
    <script>
      (function () {
        function ensure(cb) {
          if (window.__attachRipple) return cb();
          var s = document.createElement("script");
          s.src = "../js/global.js";
          s.onload = cb;
          s.onerror = cb;
          document.head.appendChild(s);
        }
        ensure(function () {
          try {
            var attach = window.__attachRipple;
            if (!attach) return;
            var mq = window.matchMedia("(max-width:1279px)");
            function apply() {
              if (mq.matches)
                attach(
                  "#sidebar-navigation-content a, #sidebar-navigation-content button",
                  {
                    color: "rgba(0,0,0,0.08)",
                  }
                );
            }
            apply();
            var t;
            window.addEventListener("resize", function () {
              clearTimeout(t);
              t = setTimeout(apply, 120);
            });
          } catch (e) {}
        });
      })();
    </script>
