<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../global.css" />
  </head>
  <body class="bg-[#f5f5f6]">
    <div
      class="bg-white shadow flex items-center justify-between px-4 h-[56px]"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-arrow-left-icon lucide-arrow-left"
      >
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
      <input
        type="text"
        placeholder="Search for brands & products"
        class="w-full h-[32px] rounded px-2 text-base text-[#282c3f] border-none outline-none"
      />

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#ff356e"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-search-icon lucide-search font-bold"
      >
        <path d="m21 21-4.34-4.34" />
        <circle cx="11" cy="11" r="8" />
      </svg>
    </div>
    <div class="py-2 bg-white mt-2">
      <h1 class="text-base font-bold mb-2 px-4">Recently Searches</h1>
      <div class="relative">
        <div class="overflow-x-auto scrollbar-hide py-2">
          <div class="flex gap-4 pl-4" id="recently-searches-products">
            <!-- Product cards will be generated here for mobile -->
          </div>
        </div>
      </div>
    </div>
    <div class="py-2 bg-white mt-2">
      <h1 class="text-base font-bold mb-2 px-4">Recently Viewed</h1>
      <div class="relative">
        <div class="overflow-x-auto scrollbar-hide">
          <div class="flex gap-4 pl-4" id="recently-viewed-products">
            <!-- Product cards will be generated here for mobile -->
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
