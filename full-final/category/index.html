<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category</title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <!-- Mobile Navbar (visible on screens smaller than xl) -->
      <div class="mobile-nav">
        <!-- back Icon -->
        <div class="button-container">

              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"

        <!-- Icons on the right -->

                  ></path>
                </g>
              </g>
            </svg>
          </a>
          <a href="#" class="relative">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                fill="#3E4152"
                fillrule="evenodd"
                d="M4.012 20.718L5.246 7.314H7.27v1.763a.733.733 0 101.466 0V7.314h6.528v1.763a.733.733 0 001.466 0V7.314h2.024l1.234 13.404H4.012zM12 3.282c1.56 0 2.865 1.1 3.187 2.565H8.813A3.268 3.268 0 0112 3.282zm8.15 3.228a.733.733 0 00-.73-.663h-2.747A4.734 4.734 0 0012 1.816a4.734 4.734 0 00-4.673 4.03H4.58a.733.733 0 00-.73.664L2.475 21.38a.734.734 0 00.73.804h17.59a.733.733 0 00.73-.803L20.15 6.51z"
              ></path>
            </svg>
            <span class="cart-counter">0</span>
          </a>
        </div>
      </div>
    </header>

    <div class="main-container">
      <div id="left-side">
        <div
          class="category-item"
          data-category="womens"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Women's Wear</div>
          </div>
        </div>

        <div
          class="category-item"
          data-category="mens"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Men's Wear</div>
          </div>
        </div>

        <div
          class="category-item active"
          data-category="footwear"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Footwear</div>
          </div>
        </div>

        <div
          class="category-item"
          data-category="beauty"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Beauty & Grooming</div>
          </div>
        </div>

        <!-- New Categories -->
        <div
          class="category-item"
          data-category="accessories"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Accessories</div>
          </div>
        </div>

        <div
          class="category-item"
          data-category="electronics"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Electronics</div>
          </div>
        </div>

        <div
          class="category-item"
          data-category="kids"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Kids</div>
          </div>
        </div>

        <div
          class="category-item"
          data-category="sports"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Sports & Fitness</div>
          </div>
        </div>

        <div
          class="category-item"
          data-category="homeLiving"
          style="position: relative"
        >
          <div class="left-border"></div>
          <div class="c-i-t">
            <div class="image">
              <img src="../img.png" />
            </div>
            <div class="category-text">Home & Living</div>
          </div>
        </div>
      </div>

      <div id="right-side">
        <div class="banner">
          <p id="banner-title">
            Footwear
            <br />
            Collection
          </p>

          <div
            style="display: flex; justify-content: center; align-items: center"
          >
            <div class="banner-image-container">
              <img src="../img.png" />
            </div>

            <div class="banner-button">
              <button class="ripple-button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="transform: rotate(180deg)"
                >
                  <path d="m12 19-7-7 7-7" />
                  <path d="M19 12H5" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="dynamic-content">
          <div class="category-section">
            <h6 style="margin-left: 10px">Women's Footwear</h6>
            <div class="category-data">
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Heels</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Flats</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Casual Shoes</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Flip Flops</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Boots</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Sport Shoes</span>
              </div>
            </div>
          </div>

          <div class="category-section">
            <h6 style="margin-left: 10px">Men's Footwear</h6>
            <div class="category-data">
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Casual Shoes</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Sport Shoes</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Formal Shoes</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Sandals</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Flip Flops</span>
              </div>
              <div class="item">
                <div><img src="../img.png" /></div>
                <span>Boots</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Get all category items and dynamic content elements
        const categoryItems = document.querySelectorAll(".category-item");
        const bannerTitle = document.getElementById("banner-title");
        const dynamicContent = document.getElementById("dynamic-content");
        const banner = document.querySelector(".banner");

        // Category data structure
        const categoryData = {
          womens: {
            title: "Women's Fashion<br>Store",
            bannerColor: "#fce8f0",
            sections: [
              {
                title: "Casual Wear",
                items: [
                  "Tops",
                  "Dresses",
                  "Jeans",
                  "Skirts",
                  "T-shirts",
                  "Blouses",
                ],
              },
              {
                title: "Ethnic Wear",
                items: ["Sarees", "Kurtas", "Lehengas"],
              },
            ],
          },
          mens: {
            title: "Men's Gen-Z<br>Fashion Store",
            bannerColor: "#e8f5e8",
            sections: [
              {
                title: "Casual Wear",
                items: [
                  "T-shirt",
                  "Shirts",
                  "Jeans",
                  "Trousers",
                  "Shorts",
                  "Track Pants",
                ],
              },
              {
                title: "Formal Wear",
                items: ["Jackets", "Sweatshirts", "Co-Ords"],
              },
            ],
          },
          footwear: {
            title: "Footwear<br>Collection",
            bannerColor: "#f0f8e8",
            sections: [
              {
                title: "Women's Footwear",
                items: [
                  "Heels",
                  "Flats",
                  "Casual Shoes",
                  "Flip Flops",
                  "Boots",
                  "Sport Shoes",
                ],
              },
              {
                title: "Men's Footwear",
                items: [
                  "Casual Shoes",
                  "Sport Shoes",
                  "Formal Shoes",
                  "Sandals",
                  "Flip Flops",
                  "Boots",
                ],
              },
            ],
          },
          beauty: {
            title: "Gen-Z Beauty<br>Store",
            bannerColor: "#e8f5e8",
            sections: [
              {
                title: "Skincare",
                items: [
                  "Serums And Gel",
                  "Moisturizers",
                  "Sunscreen",
                  "Masks & Peels",
                  "Face Wash",
                ],
              },
              {
                title: "Hair Care",
                items: [
                  "Shampoos",
                  "Conditioners",
                  "Hair Serums",
                  "Hair Masks",
                  "Hair Oils",
                  "Hair Appliances",
                ],
              },
              {
                title: "Bath & Body",
                items: [
                  "Body Washes & Shower Gels",
                  "Body Lotion",
                  "Body Mists & Sprays",
                ],
              },
              {
                title: "MakeUp",
                items: ["Foundation", "Lipstick", "Eye Makeup"],
              },
            ],
          },
          accessories: {
            title: "Accessories<br>Corner",
            bannerColor: "#f5f0ff",
            sections: [
              {
                title: "Jewelry",
                items: [
                  "Earrings",
                  "Necklaces",
                  "Bracelets",
                  "Rings",
                  "Anklets",
                ],
              },
              {
                title: "Bags & Wallets",
                items: [
                  "Handbags",
                  "Backpacks",
                  "Wallets",
                  "Clutches",
                  "Sling Bags",
                ],
              },
              {
                title: "Watches & Sunglasses",
                items: [
                  "Smart Watches",
                  "Analog Watches",
                  "Sunglasses",
                  "Eyewear Frames",
                ],
              },
            ],
          },
          electronics: {
            title: "Electronics<br>Zone",
            bannerColor: "#e8f0f8",
            sections: [
              {
                title: "Mobiles & Gadgets",
                items: [
                  "Smartphones",
                  "Smartwatches",
                  "Earbuds",
                  "Headphones",
                  "Power Banks",
                ],
              },
              {
                title: "Computers & Accessories",
                items: [
                  "Laptops",
                  "Keyboards",
                  "Mice",
                  "Monitors",
                  "External Hard Drives",
                ],
              },
              {
                title: "Home Appliances",
                items: [
                  "Smart TVs",
                  "Speakers",
                  "Air Conditioners",
                  "Washing Machines",
                  "Refrigerators",
                ],
              },
            ],
          },
          kids: {
            title: "Kids' World<br>Store",
            bannerColor: "#fff5e8",
            sections: [
              {
                title: "Boys Fashion",
                items: ["T-Shirts", "Jeans", "Shorts", "Sweaters", "Shoes"],
              },
              {
                title: "Girls Fashion",
                items: ["Dresses", "Tops", "Skirts", "Leggings", "Sandals"],
              },
              {
                title: "Toys & Games",
                items: [
                  "Action Figures",
                  "Puzzles",
                  "Board Games",
                  "Dolls",
                  "Educational Toys",
                ],
              },
            ],
          },
          sports: {
            title: "Sports & Fitness<br>Gear",
            bannerColor: "#e8fff0",
            sections: [
              {
                title: "Clothing",
                items: ["Sports T-Shirts", "Shorts", "Tracksuits", "Jerseys"],
              },
              {
                title: "Footwear",
                items: [
                  "Running Shoes",
                  "Football Shoes",
                  "Basketball Shoes",
                  "Training Shoes",
                ],
              },
              {
                title: "Equipment",
                items: [
                  "Cricket Bats",
                  "Football",
                  "Yoga Mats",
                  "Dumbbells",
                  "Bicycles",
                ],
              },
            ],
          },
          homeLiving: {
            title: "Home & Living<br>Essentials",
            bannerColor: "#f9f5f0",
            sections: [
              {
                title: "Home Decor",
                items: ["Wall Art", "Clocks", "Vases", "Cushions", "Lighting"],
              },
              {
                title: "Kitchen & Dining",
                items: [
                  "Cookware",
                  "Dinner Sets",
                  "Glassware",
                  "Storage Containers",
                ],
              },
              {
                title: "Bedding",
                items: [
                  "Bedsheets",
                  "Pillows",
                  "Blankets",
                  "Mattress Protectors",
                ],
              },
            ],
          },
        };

        // Function to update content based on selected category
        function updateContent(categoryKey) {
          const data = categoryData[categoryKey];
          if (!data) return;

          // Update banner
          bannerTitle.innerHTML = data.title;
          banner.style.background = data.bannerColor;

          // Update dynamic content
          let sectionsHTML = "";
          data.sections.forEach((section) => {
            sectionsHTML += `
              <div class="category-section">
                <h6 style="margin-left: 10px">${section.title}</h6>
                <div class="category-data">
                  ${section.items
                    .map(
                      (item) => `
                    <div class="item">
                      <div><img src="../img.png" /></div>
                      <span>${item}</span>
                    </div>
                  `
                    )
                    .join("")}
                </div>
              </div>
            `;
          });

          dynamicContent.innerHTML = sectionsHTML;
        }

        // Add click event listeners to category items
        categoryItems.forEach((item) => {
          item.addEventListener("click", function () {
            // Remove active class from all items
            categoryItems.forEach((cat) => cat.classList.remove("active"));

            // Add active class to clicked item
            this.classList.add("active");

            // Get category key and update content
            const categoryKey = this.getAttribute("data-category");
            updateContent(categoryKey);
          });
        });

        // Back button functionality
        const backButton = document.getElementById("backButton");
        if (backButton) {
          backButton.addEventListener("click", function () {
            window.history.back();
          });
        }
      });
    </script>
  </body>
</html>
