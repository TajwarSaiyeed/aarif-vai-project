      /* Skeleton animations */
      @keyframes shimmer {
        0% {
          background-position: -200px 0;
        }
        100% {
          background-position: calc(200px + 100%) 0;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }

      .skeleton-box {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite linear;
        border-radius: 4px;
      }

      .skeleton-text {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite linear;
        border-radius: 2px;
      }

      .skeleton-circle {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite linear;
        border-radius: 50%;
      }

      .skeleton-pulse {
        animation: pulse 2s infinite;
      }

      /* Logo skeleton */
      .logo-skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite linear;
        width: 54px;
        height: 45px;
        border-radius: 4px;
      }

      /* Hide scrollbar for mobile sections */
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Loading indicator styles */
      .loading-spinner {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Ensure page background */
      body {
        min-height: 100vh;
        background-color: #f4f4f5;
      }

      @media (min-width: 1024px) {
        body {
          background-color: white;
        }
      }
    </style>

    <script>
      console.log("Cart skeleton loading page started");

      // Simulate loading completion after 3 seconds
      setTimeout(() => {
        console.log("Redirecting to cart page");
        // Redirect to actual cart page
        window.location.href = "./cartv3.html";
      }, 6500);

      // Add fallback for browsers that don't support some CSS
      document.addEventListener("DOMContentLoaded", function () {
        console.log("DOM loaded, skeleton should be visible");

        // Ensure all skeleton elements are visible
        const skeletonElements = document.querySelectorAll(
          ".skeleton-text, .skeleton-box, .skeleton-circle"
        );
        skeletonElements.forEach((el) => {
          if (!el.style.backgroundColor) {
            el.style.backgroundColor = "#f0f0f0";
          }
        });

        // Additional visibility checks
        const body = document.body;
        const loadingIndicator = document.querySelector(".fixed.top-1\\/2");

        console.log("Body classes:", body.className);
        console.log(
          "Loading indicator visible:",
          loadingIndicator ? "Yes" : "No"
        );

        // Force minimum height for body
        body.style.maxHeight = "100vh";
      });
    </script>
  </body>
