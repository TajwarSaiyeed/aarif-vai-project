    <style>
      /* Font fallback */
      body {
        font-family: "Assistant", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      @keyframes shimmer {
        0% {
          background-position: -200px 0;
        }
        100% {
          background-position: calc(200px + 100%) 0;
        }
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 4px;
        min-height: 1rem;
      }

      .skeleton-text {
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite;
        min-height: 1rem;
        display: block;
      }

      .skeleton-box {
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite;
        min-height: 1rem;
        display: block;
      }

      .skeleton-circle {
        border-radius: 50%;
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite;
        min-height: 1rem;
        min-width: 1rem;
        display: block;
      }

      /* Rounded pill skeletons for category slider */
      .skeleton-pill {
        display: inline-block;
        border-radius: 9999px;
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite;
      }

      /* Pulse animation for variety */
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .skeleton-pulse {
        animation: pulse 2s infinite;
        background-color: #f0f0f0;
        border-radius: 4px;
        min-height: 1rem;
      }

      /* Ensure visibility */
      .skeleton-text,
      .skeleton-box,
      .skeleton-circle,
      .skeleton {
        opacity: 1 !important;
        visibility: visible !important;
      }
    </style>
