<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      @font-face {
        font-family: "Assistant";
        src: url("https://constant.myntassets.com/www/fonts/Assistant-Regular.eot");
        src: url("https://constant.myntassets.com/www/fonts/Assistant-Regular.eot?#iefix")
            format("embedded-opentype"),
          url("https://constant.myntassets.com/www/fonts/Assistant-Regular.woff")
            format("woff"),
          url("https://constant.myntassets.com/www/fonts/Assistant-Regular.ttf")
            format("truetype");
        font-weight: 400;
        font-display: swap;
        font-style: normal;
      }

      @font-face {
        font-family: "Assistant";
        src: url("https://constant.myntassets.com/www/fonts/Assistant-Bold.eot");
        src: url("https://constant.myntassets.com/www/fonts/Assistant-Bold.eot?#iefix")
            format("embedded-opentype"),
          url("https://constant.myntassets.com/www/fonts/Assistant-Bold.woff")
            format("woff"),
          url("https://constant.myntassets.com/www/fonts/Assistant-Bold.ttf")
            format("truetype");
        font-weight: 700;
        font-display: swap;
        font-style: normal;
      }

      body {
        font-family: "Assistant", -apple-system, BlinkMacSystemFont, Segoe UI,
          Roboto, Helvetica, Arial, sans-serif;
      }

      .myntraweb-sprite {
        background: url(https://constant.myntassets.com/web/assets/img/MyntraWebSprite_27_01_2021.png);
        background-size: 1404px 105px;
        display: inline-block;
      }

      .sprites-headerLogo {
        width: 53px;
        height: 36px;
        background-position: -462px 0;
      }

      .sprites-search {
        width: 21px;
        height: 21px;
        background-position: -754px 0;
      }

      .sprites-headerUser {
        width: 24px;
        height: 24px;
        background-position: -298px -56px;
      }

      .sprites-headerWishlist {
        width: 17px;
        height: 22px;
        background-position: -315px -187px;
      }

      .sprites-headerBag {
        width: 22px;
        height: 22px;
        background-position: -341px -56px;
      }

      /* Custom hover effects for navigation */
      .nav-link:hover {
        border-bottom: 4px solid #ff3f6c;
        transition: all 0.2s ease-out;
      }

      /* Search input focus styles */
      .search-input:focus + .search-submit {
        background-color: #fff;
        border-color: #eaeaec;
      }
    </style>
  </head>
  <body>
    <header
      class="bg-white z-10 fixed top-0 right-0 left-0 shadow-[0_4px_12px_0_rgba(0,0,0,0.05)]"
    >
      <div class="flex items-center justify-between px-4 py-4 gap-2">
        <!-- logo -->
        <div class="float-left h-inherit ml-[4%]">
          <a href="#" class="inline-block align-middle p-0 m-0 cursor-pointer">
            <span class="myntraweb-sprite sprites-headerLogo"></span>
          </a>
        </div>

        <!-- navs -->
        <div class="flex bg-green-500 relative">
          <div class="group">
            <a
              href="#"
              class="inline px-[17px] pb-[28px] text-center no-underline text-sm tracking-[0.3px] text-[#282c3f] font-bold uppercase hover:border-b-4 hover:border-[#ff3f6c]"
              >MEN</a
            >

            <div
              class="bg-gray-500 p-10 w-[calc(100vw - 200px)] absolute z-[9999999] -left-[100px] top-12 invisible opacity-0 group-hover:visible group-hover:opacity-100 transition-all duration-200"
            >
              hello world
            </div>
          </div>
          <div class="group">
            <a
              href="#"
              class="inline px-[17px] pb-[28px] text-center no-underline text-sm tracking-[0.3px] text-[#282c3f] font-bold uppercase hover:border-b-4 hover:border-[#ff3f6c]"
              >Women</a
            >
            <div
              class="bg-gray-500 p-10 w-[calc(100vw - 200px)] absolute z-[9999999] -left-[100px] top-12 invisible opacity-0 group-hover:visible group-hover:opacity-100 transition-all duration-200"
            >
              hello wormin
            </div>
          </div>

              <a
                href="#"
                class="inline px-[17px] pb-[28px] text-center no-underline text-sm tracking-[0.3px] text-[#282c3f] font-bold uppercase hover:border-b-4 hover:border-[#ff3f6c] transition-all duration-200"
                >WOMEN</a
              >
            </div>
            <div class="float-left border-hidden text-center">
              <a
                href="#"
                class="inline px-[17px] pb-[28px] text-center no-underline text-sm tracking-[0.3px] text-[#282c3f] font-bold uppercase hover:border-b-4 hover:border-[#ff3f6c] transition-all duration-200"
                >KIDS</a
              >
            </div>
            <div class="float-left border-hidden text-center">
              <a
                href="#"
                class="inline px-[17px] pb-[28px] text-center no-underline text-sm tracking-[0.3px] text-[#282c3f] font-bold uppercase hover:border-b-4 hover:border-[#ff3f6c] transition-all duration-200"
                >HOME & LIVING</a
              >
            </div>
            <div class="float-left border-hidden text-center">
              <a
                href="#"
                class="inline px-[17px] pb-[28px] text-center no-underline text-sm tracking-[0.3px] text-[#282c3f] font-bold uppercase hover:border-b-4 hover:border-[#ff3f6c] transition-all duration-200"
                >BEAUTY</a
              >
            </div>
            <div class="float-left border-hidden text-center">
              <a
                href="#"
                class="inline px-[17px] pb-[28px] text-center no-underline text-sm tracking-[0.3px] text-[#282c3f] font-bold uppercase hover:border-b-4 hover:border-[#ff3f6c] transition-all duration-200"
                >STUDIO</a
              >
            </div> -->
        </div>

        <!-- search -->
        <div class="max-w-[400px] w-full float-right leading-0 relative">
          <a href="#" class="absolute top-1/2 -translate-y-1/2 pl-2 ml-1">
            <span
              class="myntraweb-sprite sprites-search inline-block scale-75"
            ></span>
          </a>
          <input
            type="text"
            placeholder="Search for products, brands and more"
            class="inline-block float-left text-sm h-5 leading-6 text-[#696e79] box-content m-0 outline-0 border border-[#f5f5f6] rounded-r bg-gray-50 pl-10 py-2 w-full focus:bg-white focus:border-[#eaeaec]"
          />
        </div>

        <!-- actions -->
        <div class="float-right flex leading-0 h-[40px] mr-[30px] ml-[10px]">
          <!-- Profile Dropdown -->
          <div class="relative h-[60px] mx-5 group">
            <div class="flex px-3 relative h-[40px]">
              <span
                class="myntraweb-sprite sprites-headerUser mt-[10px] absolute bottom-[13px] left-[5px] block"
              ></span>
              <span
                class="text-black absolute bottom-1 left-0 text-xs font-bold inline-block pt-[10px] leading-[6px]"
                >Profile</span
              >
            </div>
            <!-- Dropdown Menu -->
            <div
              class="invisible opacity-0 group-hover:visible group-hover:opacity-100 w-[250px] -left-[137.5px] top-[62px] absolute py-[25px] px-4 z-[9] shadow-lg transition-all duration-200 bg-white text-[#3e4152] border border-[#f5f5f6] -mt-[2px]"
            >
              <!-- Arrow -->
              <div
                class="block -top-[5px] absolute w-[58px] border-b-4 border-[#f16565] left-[124px]"
              ></div>
              <!-- Content -->
              <div class="block">
                <div class="block pb-[2px]">
                  <div
                    class="font-bold h-5 text-sm w-full whitespace-nowrap overflow-hidden text-ellipsis leading-[10px]"
                  >
                    Welcome
                  </div>
                  <div
                    class="h-[14px] text-[#282c3f] text-sm w-full whitespace-nowrap leading-[10px]"
                  >
                    To access account and manage orders
                  </div>
                </div>
                <div>
                  <div class="inline-block w-full py-[10px] border-t-0">
                    <a
                      data-refreshPage="true"
                      href="/website/login.html"
                      data-track="login"
                      class="inline-block py-2 px-4 border border-[#eaeaec] rounded-sm text-center uppercase text-sm text-[#ff3f6c] font-bold hover:border-[#ff3f6c]"
                      >login / Signup</a
                    >
                  </div>
                  <div
                    class="flex flex-col w-full py-[10px] space-y-2 border-t border-[#eaeaec]"
                  >
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Orders
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Wishlist
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Gift Cards
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Contact Us
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Myntra Insider
                        <span
                          class="inline-block p-px py-0 bg-[#ff3f6c] border border-[#ff3f6c] text-white font-black ml-[10px] -mt-[6px] -mb-[10px] text-[10px] skew-x-[-10deg] rounded-sm"
                        >
                          New
                        </span>
                      </div>
                    </a>
                  </div>
                  <div
                    class="flex flex-col w-full py-[10px] space-y-2 border-t border-[#eaeaec]"
                  >
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Myntra Credit
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Coupons
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Saved Cards
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Saved VPA
                      </div>
                    </a>
                    <a
                      href="#"
                      data-track="coupons"
                      class="font-normal text-sm text-[#3e4152]"
                    >
                      <div class="m-0 cursor-pointer hover:font-bold">
                        Saved Addresses
                      </div>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Wishlist -->
          <a href="#" class="flex no-underline relative mx-[55px] ml-[10px]">
            <span
              class="myntraweb-sprite sprites-headerWishlist mt-2 absolute bottom-[14px] left-[13px]"
            ></span>
            <span
              class="text-black absolute bottom-1 left-0 text-xs font-bold inline-block pt-[10px] leading-[6px]"
              >Wishlist</span
            >
          </a>

          <!-- Cart -->
          <a href="#" class="flex no-underline relative mr-[50px] ml-[15px]">
            <span
              class="myntraweb-sprite sprites-headerBag mt-2 absolute bottom-[14px] -left-[1px]"
            ></span>
            <span
              class="whitespace-nowrap text-center leading-[18px] px-[6px] h-[18px] bg-[#7e818c] absolute rounded-full text-xs text-white left-[13px] -top-[2px] font-bold invisible"
              >0</span
            >
            <span
              class="text-black absolute bottom-1 left-0 text-xs font-bold inline-block pt-[10px] leading-[6px]"
              >Bag</span
            >
          </a>
        </div>
      </div>
    </header>
  </body>
</html>
